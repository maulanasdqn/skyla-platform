[workspace]
resolver = "2"
members = [
    "crates/skyla-chat",
    "crates/skyla-cli",
    "crates/skyla-ffi",
    "crates/skyla-server",
    "crates/skyla-tok",
    "crates/skyla-types",
]
default-members = [
    "crates/skyla-chat",
    "crates/skyla-cli",
    "crates/skyla-server",
    "crates/skyla-tok",
    "crates/skyla-types",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/maulanasdqn/skyla-platform"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive"] }
fancy-regex = "0.14"
futures = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skyla-chat = { path = "crates/skyla-chat" }
skyla-engine = { path = "../skyla-kernel/skyla-engine" }
skyla-gguf = { path = "../skyla-kernel/skyla-gguf" }
skyla-ref = { path = "../skyla-kernel/skyla-ref" }
skyla-server = { path = "crates/skyla-server" }
skyla-shaders = { path = "../skyla-kernel/skyla-shaders" }
skyla-tok = { path = "crates/skyla-tok" }
skyla-types = { path = "crates/skyla-types" }
skyla-vk = { path = "../skyla-kernel/skyla-vk" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
ureq = { version = "2", features = ["json"] }
tower-http = { version = "0.6", features = ["fs"] }

[profile.release]
debug = 1
